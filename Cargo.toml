[package]
name = "wayland-wispr"
version = "0.1.0"
edition = "2024"
description = "Wayland-native dictation overlay"
license = "MIT"
publish = false

[dependencies]
# GTK4 0.11 and gtk4-layer-shell 0.8 both target the gtk-rs 0.22 (glib) line.
gtk4 = { version = "0.11", features = ["v4_12"] }
glib-unix = "0.22"
gtk4-layer-shell = "0.8"
async-channel = "2.5"

# Native Wayland protocol access on a separate connection (pure-Rust backend,
# so it does not interfere with gtk4-layer-shell's libwayland link order).
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
xkbcommon = { version = "0.9", default-features = false }
# Native PipeWire host (preferred by default_host), ALSA as fallback.
cpal = { version = "0.18", features = ["pipewire"] }
rubato = "5"
hound = "3.5"
rtrb = "0.4"

clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
# Local transcription (whisper.cpp). CPU by default; GPU backends via features.
# raw-api: ggml device registry + encoder-begin callback (see transcription/whisper.rs).
whisper-rs = { version = "0.16", optional = true, features = ["tracing_backend", "raw-api"] }
rustix = { version = "1.1", features = ["net", "process", "fs", "time"] }

[features]
default = ["local-whisper"]
# Local whisper.cpp transcription on the CPU.
local-whisper = ["dep:whisper-rs"]
# Vulkan GPU acceleration (AMD/Intel/NVIDIA). Needs Vulkan headers, glslc,
# and the loader at build time (all in the dev shell) and a GPU driver at runtime.
whisper-vulkan = ["local-whisper", "whisper-rs/vulkan"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"

