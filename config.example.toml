# Copy to $XDG_CONFIG_HOME/wayland-wispr/config.toml. All keys are optional.

[overlay]
layer = "overlay"     # or "top"
position = "bottom"   # top-left | top | top-right | left | center | right
                      # | bottom-left | bottom | bottom-right
margin = 48           # logical pixels from the anchored edge(s)
# margin_x = 16       # override for the left/right edge
# margin_y = 48       # override for the top/bottom edge
# output = "DP-1"     # connector name; default: the compositor chooses
scale = 1.0           # size of the pill (0.5-4); margins are not scaled
opacity = 0.88        # pill background (0 = transparent, 1 = opaque); text stays opaque
# Custom GTK CSS layered over the built-in default theme; it can override any
# rule (`wayland-wispr default-theme` prints the built-in one as a template).
# Relative paths are relative to this file; a missing file falls back to the
# default. Either one stylesheet:
# theme = "theme.css"
# or light/dark variants, switched live by darkman (else the XDG portal's
# color-scheme; dark when neither is available). An omitted variant uses the
# default theme. Example light theme: themes/light.css in the repo.
# theme = { light = "light.css", dark = "dark.css" }

[recording]
max_seconds = 120   # recording stops automatically after this
pause_media = true  # pause playing media players (MPRIS) while recording

[audio]
host = "auto"                  # PipeWire if available, else ALSA; or "pipewire" / "alsa"
# device = "..."               # name or id from `wayland-wispr devices`
min_seconds = 0.3              # shorter recordings are rejected
silence_threshold_dbfs = -50.0 # quieter recordings are rejected as "no speech"

[transcription]
backend = "whisper"            # local whisper.cpp; "fake" = placeholder text (UI/insert tests)

[transcription.whisper]
model = "base-q5_1"            # → $XDG_DATA_HOME/wayland-wispr/models/ggml-<model>.bin
# models_dir = "/path"         # relative paths are relative to this file
# model_path = "/path/ggml-large-v3-turbo-q5_0.bin"  # explicit file, overrides model
device = "cpu"                 # "gpu" needs a build with `--features whisper-vulkan`
# gpu_device = 0               # index as listed by `wayland-wispr bench`
flash_attn = true
# threads = 8                  # default: available cores, at most 8
language = "auto"             # or a fixed code like "de"; a fixed language that
                               # doesn't match the speech gets *translated* into it
languages = ["de", "en"]       # with "auto": only choose among these ([] = any)
# initial_prompt = "Names: makussu, riverfx, fenster."  # vocabulary hints
beam_size = 1                  # 1 = greedy (fast); 5 = beam search (better, slower)
keep_loaded = "idle"           # "always" | "idle" | "never" (unload after each use)
idle_unload_secs = 300         # with "idle": free (V)RAM after this long unused
preload = true                 # start loading the model when recording starts

[cleanup]
# LLM cleanup of the transcript (fillers, self-corrections, punctuation, spoken
# "new line"/"neuer Absatz", lists). Needs an OpenAI-compatible server that you
# run yourself, e.g. `ollama serve` + `ollama pull gemma4:12b`.
# If it is unreachable or replies badly, the raw transcript is used.
enabled = true
base_url = "http://127.0.0.1:11434/v1"   # Ollama; llama-server: http://127.0.0.1:8080/v1
model = "gemma4:12b"           # ~6.5 GB loaded; less memory: "qwen2.5:7b-instruct" (drop reasoning_effort)
reasoning_effort = "none"      # required for thinking models (Gemma 4, Qwen3.x), else they think for ages
# api_key_env = "WAYLAND_WISPR_LLM_API_KEY"  # remote providers; plain http only to localhost
# allow_insecure_http = false # allow http:// to non-local hosts (sends text unencrypted)
temperature = 0.0
connect_timeout_ms = 1000
timeout_secs = 30             # includes a cold model load
min_words = 4                 # shorter transcripts are used as-is
preload = true                # load the model on the server when recording starts (local servers only)
# prompt_file = "/path/prompt.toml"  # replace the built-in prompt (see src/cleanup/prompt.toml)

[injection]
# When a result is ready: "insert" (copy + type into the focused field),
# "copy" (clipboard only), or "none" (wait for `copy`/`insert`).
on_ready = "insert"
# "type": per-character virtual-keyboard typing, independent of app shortcuts.
# "paste": send paste_chord instead (needs the right chord per app).
method = "type"
newline = "shift_enter"    # or "enter" (may submit/run commands) or "space"
type_delay_ms = 2          # pause after each typed character
paste_chord = "ctrl+v"     # method = "paste" only; terminals: "ctrl+shift+v"
pre_insert_delay_ms = 150  # lets you release the keybinding that triggered insert
key_delay_ms = 10

[note]
# `wayland-wispr note`: record like `toggle`, but pipe the (cleaned) transcript
# into this executable on stdin instead of typing it. Any language works; the
# script decides where the note goes (a file, a notes app, an upload, …).
# Relative paths are relative to this file; ~/ is the home directory.
# hook = "note.sh"        # gets the text on stdin; exit 0 = saved
timeout_secs = 30          # the hook is killed after this long

[debug]
fake_processing_ms = 1500  # duration of the "fake" transcription backend
# save_recordings_dir = "/path"  # debug only: save every recording as WAV
# fake_transcript = "Grüße, 世界 👋\nsecond line"  # "fake" backend text for copy/insert tests
