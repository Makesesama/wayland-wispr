# Development config, used automatically inside `nix develop` / direnv in this
# repo (via WAYLAND_WISPR_CONFIG). Edit freely and restart `cargo run -- run`.
# Never put secrets here; API keys will be read from environment variables.

[overlay]
layer = "overlay"
margin_bottom = 48

[recording]
max_seconds = 120

[audio]
host = "auto"                   # PipeWire if available, else ALSA; or "pipewire" / "alsa"
# device = "..."                # see `cargo run -- devices`; default input if unset
min_seconds = 0.3
silence_threshold_dbfs = -50.0

[transcription]
backend = "whisper"             # "fake" skips the model (UI/insertion tests)

[transcription.whisper]
# Models live in dev/models/ (gitignored); see README for downloads.
models_dir = "models"
# GPU (RX 9070 XT = gpu_device 0; the iGPU is 1): run with `cargo run --features whisper-vulkan -- run`.
# Without the GPU build use device = "cpu" and e.g. model = "small-q5_1".
model = "large-v3-turbo-q5_0"
device = "gpu"
language = "auto"
languages = ["de", "en"]
beam_size = 5
keep_loaded = "idle"
idle_unload_secs = 300

[cleanup]
# Needs `ollama serve` and `ollama pull qwen2.5:7b-instruct`; without it the
# raw transcript is used. Compare models/prompts with
# `cargo run -- cleanup-eval dev/cleanup-fixtures.toml --model <name>`.
enabled = true
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b-instruct"
# Qwen3.8-27B on the 16 GiB card next to Whisper: a ~3-bit quant, thinking off.
# model = "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-IQ3_XXS"
# reasoning_effort = "none"

[injection]
paste_chord = "ctrl+v"     # terminals: "ctrl+shift+v" or "shift+Insert"
pre_insert_delay_ms = 150
key_delay_ms = 10

[debug]
fake_processing_ms = 500
# Normalized 16 kHz mono WAVs of every recording go to dev/recordings/
# (gitignored, private permissions). Listen with e.g. `pw-play <file>`.
save_recordings_dir = "recordings"
# With transcription.backend = "fake": paste fixed test text instead of the
# placeholder that reports the recorded duration (Unicode, emoji, multiline, tab).
# fake_transcript = "Grüße aus wayland-wispr, 世界 👋\nzweite Zeile\tmit Tab"
